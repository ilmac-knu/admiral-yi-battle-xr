<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>이순신 장군 | 책상 위 판옥선 바다 XR</title><style>*{box-sizing:border-box}body{margin:0;background:#0c1d30;color:white;font-family:system-ui,'Malgun Gothic',sans-serif}header{padding:13px 16px;background:#172f4a}h2{margin:0;font-size:21px}small{color:#c7d9ea}#view{height:72vh;min-height:380px;position:relative;touch-action:none}#status{background:#142d48;padding:12px;min-height:44px}#panel{display:flex;flex-wrap:wrap;gap:9px;padding:12px;background:#233e59}button{background:#f3d17e;color:#182b3c;border:0;border-radius:7px;padding:12px;font-weight:700;cursor:pointer}button:disabled{opacity:.45;cursor:not-allowed}.note{padding:12px;font-size:13px;color:#c9d8e9}#badge{position:absolute;top:12px;left:12px;background:#14283dbd;padding:9px;border-radius:7px;font-size:13px;pointer-events:none}#reticle{display:none;position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:48px;height:48px;border:3px solid #f5d67f;border-radius:50%;pointer-events:none}</style><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.164.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.164.1/examples/jsm/"}}</script></head><body><header><h2>이순신 장군의 바다 — 판옥선 XR</h2><small>1차 실습 · 책상 위 바다와 멀리서 다가오는 판옥선</small></header><div id="view"><div id="badge">3D 미리보기 / 지원 기기에서는 카메라 AR</div><div id="reticle"></div></div><div id="status">3D 모델을 불러오는 중입니다…</div><div id="panel"><button id="preview" disabled>▶ 3D 해전 연출 시작</button><button id="ar" disabled>📷 카메라 AR 시작</button><button id="place" style="display:none">이 위치에 바다 배치</button><button id="again" disabled>↻ 다시 보기</button></div><div class="note">녹색 원이 나타나면 바다 배치 버튼을 누르세요. 카메라 AR: Android Chrome의 WebXR AR 지원 기기에서 HTTPS로 실행하세요. 바닥을 천천히 비춰 표면을 찾고 '이 위치에 바다 배치'를 누릅니다. 미지원 기기에서는 3D 미리보기로 체험할 수 있습니다. 첫 실습에는 적선과 포격이 포함되지 않습니다.</div><script type="module">
import * as THREE from 'three';import {OrbitControls} from 'three/addons/controls/OrbitControls.js';import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
const base='https://ilmac-knu.github.io/admiral-yi-history-xr/';const status=document.querySelector('#status'),view=document.querySelector('#view'),preview=document.querySelector('#preview'),ar=document.querySelector('#ar'),place=document.querySelector('#place'),again=document.querySelector('#again'),badge=document.querySelector('#badge');
const scene=new THREE.Scene();scene.background=new THREE.Color(0xc2d6e0);const camera=new THREE.PerspectiveCamera(50,1,.01,100);camera.position.set(0,2.8,6.5);const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.xr.enabled=true;renderer.outputColorSpace=THREE.SRGBColorSpace;view.prepend(renderer.domElement);const orbit=new OrbitControls(camera,renderer.domElement);orbit.target.set(0,.1,0);orbit.enableDamping=true;orbit.update();scene.add(new THREE.HemisphereLight(0xffffff,0x507187,2.5));const sun=new THREE.DirectionalLight(0xfff6df,2.3);sun.position.set(2,7,4);scene.add(sun);
const world=new THREE.Group();scene.add(world);world.visible=false;const seaGeo=new THREE.PlaneGeometry(5,5,65,65);seaGeo.rotateX(-Math.PI/2);const sea=new THREE.Mesh(seaGeo,new THREE.MeshStandardMaterial({color:0x06344c,metalness:.25,roughness:.38,transparent:true,opacity:.94,side:THREE.DoubleSide}));world.add(sea);const seaBase=Float32Array.from(seaGeo.attributes.position.array);const boatRoot=new THREE.Group();world.add(boatRoot);let ship,admiral,ready=false,active=false,startTime=0,arSession=null,hitSource=null,viewerSpace=null,refSpace=null,placed=false,hitMatrix=new THREE.Matrix4();const clock=new THREE.Clock();
const marker=new THREE.Mesh(new THREE.RingGeometry(.075,.095,48),new THREE.MeshBasicMaterial({color:0x00ff66,side:THREE.DoubleSide,depthTest:false}));marker.rotation.x=-Math.PI/2;marker.renderOrder=100;marker.visible=false;scene.add(marker);
function setStatus(s){status.textContent=s}const loader=new GLTFLoader();function load(u){return new Promise((res,rej)=>loader.load(u,g=>res(g.scene),undefined,rej))}
Promise.all([load(base+'Sketchfab_panokseon.glb'),load(base+'admiral-yi-sunsin.glb')]).then(([s,f])=>{ship=s;boatRoot.add(ship);let b=new THREE.Box3().setFromObject(ship),size=b.getSize(new THREE.Vector3()),c=b.getCenter(new THREE.Vector3());let k=1.45/Math.max(size.x,size.y,size.z);ship.scale.multiplyScalar(k);ship.position.sub(c.multiplyScalar(k));ship.updateMatrixWorld(true);b=new THREE.Box3().setFromObject(ship);size=b.getSize(new THREE.Vector3());const length=Math.max(size.x,size.z),width=Math.min(size.x,size.z),axis=size.x>=size.z?'x':'z';const fb=new THREE.Box3().setFromObject(f),fs=fb.getSize(new THREE.Vector3()),fc=fb.getCenter(new THREE.Vector3());f.position.set(-fc.x,-fb.min.y,-fc.z);f.scale.setScalar(1/Math.max(fs.y,.001));admiral=new THREE.Group();admiral.add(f);boatRoot.add(admiral);const x=(axis==='x'?.97:.4)*0; // keep original positioning formula below
const forward=.97*length*.44,side=.4*width*.44;const px=axis==='x'?forward:side,pz=axis==='z'?forward:side;const ray=new THREE.Raycaster(new THREE.Vector3(px,b.max.y+1,pz),new THREE.Vector3(0,-1,0));const hits=ray.intersectObject(ship,true);let deck=hits.find(h=>h.point.y>b.min.y+size.y*.1&&h.point.y<b.min.y+size.y*.55);admiral.position.set(px,deck?.point.y??b.min.y+size.y*.32,pz);admiral.scale.setScalar(length*.45*.34);admiral.rotation.y=Math.PI+(axis==='x'?Math.PI/2:0);boatRoot.position.y=-b.min.y+.06;ready=true;preview.disabled=false;again.disabled=false;world.visible=true;reset();setStatus('두 GLB 준비 완료. 3D 연출 시작 또는 카메라 AR 시작을 선택하세요.');}).catch(e=>{console.error(e);setStatus('모델 로딩 실패: '+e.message+' · 기존 저장소 파일 경로를 확인하세요.')});
function reset(){startTime=performance.now()/1000;active=false;boatRoot.position.z=-2.1;boatRoot.scale.setScalar(.65);boatRoot.rotation.set(0,Math.PI,0)}function begin(){if(!ready)return;world.visible=true;reset();active=true;startTime=performance.now()/1000;setStatus('멀리서 판옥선이 다가옵니다. 화면을 드래그하거나 스마트폰을 움직여 살펴보세요.')}preview.onclick=()=>{if(arSession)return;world.position.set(0,0,0);world.scale.setScalar(1);begin()};again.onclick=()=>{if(ready)begin()};
async function checkAR(){if(!navigator.xr||!window.isSecureContext){ar.disabled=true;ar.textContent='AR 미지원 · 3D 사용';return}try{const ok=await navigator.xr.isSessionSupported('immersive-ar');ar.disabled=!ok;ar.textContent=ok?'📷 카메라 AR 시작':'AR 미지원 · 3D 사용'}catch{ar.disabled=true;ar.textContent='AR 미지원 · 3D 사용'}}checkAR();
ar.onclick=async()=>{try{arSession=await navigator.xr.requestSession('immersive-ar',{requiredFeatures:['hit-test','local'],optionalFeatures:['dom-overlay'],domOverlay:{root:document.body}});renderer.xr.setReferenceSpaceType('local');await renderer.xr.setSession(arSession);scene.background=null;orbit.enabled=false;world.visible=false;placed=false;active=false;marker.visible=false;place.dataset.found='';place.textContent='이 위치에 바다 배치';badge.textContent='책상이나 바닥을 천천히 비춰주세요';place.style.display='inline-block';place.disabled=true;refSpace=await arSession.requestReferenceSpace('local');viewerSpace=await arSession.requestReferenceSpace('viewer');hitSource=await arSession.requestHitTestSource({space:viewerSpace});arSession.addEventListener('end',()=>{arSession=null;hitSource=null;marker.visible=false;scene.background=new THREE.Color(0xc2d6e0);orbit.enabled=true;place.style.display='none';badge.textContent='3D 미리보기 / 지원 기기에서는 카메라 AR';world.position.set(0,0,0);world.scale.setScalar(1);world.visible=true;reset();setStatus('AR 종료. 3D 미리보기로 돌아왔습니다.')});setStatus('바닥이나 책상을 비추어 표면을 인식시키세요.')}catch(e){console.error(e);setStatus('AR 실행 실패: '+e.message);arSession=null}};
place.onclick=()=>{if(!arSession||!hitSource||!place.dataset.found)return;world.position.setFromMatrixPosition(hitMatrix);world.quaternion.setFromRotationMatrix(hitMatrix);world.scale.setScalar(.28);world.visible=true;placed=true;marker.visible=false;begin();place.disabled=true;place.textContent='바다 배치 완료';badge.textContent='판옥선이 바다 위로 접근 중';setStatus('바다가 배치되었습니다. 판옥선이 다가옵니다.')} ;
function resize(){const w=view.clientWidth,h=view.clientHeight;renderer.setSize(w,h);camera.aspect=w/h;camera.updateProjectionMatrix()}addEventListener('resize',resize);resize();
renderer.setAnimationLoop((t,frame)=>{const elapsed=t/1000,arr=sea.geometry.attributes.position;for(let i=0;i<arr.count;i++){const o=i*3;arr.array[o+1]=seaBase[o+1]+.018*Math.sin(seaBase[o]*4+elapsed*1.8)*Math.cos(seaBase[o+2]*3+elapsed*1.4)}arr.needsUpdate=true;sea.geometry.computeVertexNormals();if(active){const p=Math.min(1,(elapsed-startTime)/9);const smooth=p*p*(3-2*p);boatRoot.position.z=-2.1+1.95*smooth;boatRoot.scale.setScalar(.65+.35*smooth);boatRoot.rotation.y=Math.PI+.02*Math.sin(elapsed*.6);if(p>=1&&active){active=false;setStatus('판옥선이 도착했습니다. 스마트폰을 움직여 판옥선을 살펴보세요.')}}boatRoot.rotation.z=.014*Math.sin(elapsed*1.4);boatRoot.rotation.x=.012*Math.cos(elapsed*1.1);if(arSession&&frame&&!placed&&hitSource){const results=frame.getHitTestResults(hitSource);if(results.length){const pose=results[0].getPose(refSpace);if(pose){hitMatrix.fromArray(pose.transform.matrix);marker.position.setFromMatrixPosition(hitMatrix);marker.quaternion.setFromRotationMatrix(hitMatrix);marker.visible=true;place.dataset.found='1';place.disabled=false;badge.textContent='표면 인식 완료 · 바다 배치 버튼을 누르세요'}}else{marker.visible=false;place.dataset.found='';place.disabled=true}}if(!arSession)orbit.update();renderer.render(scene,camera)});
</script></body></html>
